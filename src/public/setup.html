<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" id="form" autocomplete="on" data-mode="setup">
    <div class="brand-mark" id="mark"></div>
    <h1>Create your login</h1>
    <p>Pick the account you'll use to manage this proxy. Nothing is preconfigured, so choose a real password.</p>

    <div class="notice error" id="error" hidden></div>

    <label class="field">
      <span class="label">Username</span>
      <input class="input" id="username" name="username" autocomplete="username" value="admin" required autofocus>
    </label>
    <label class="field">
      <span class="label">Password</span>
      <input class="input" id="password" name="password" type="password" autocomplete="new-password"
             minlength="8" required>
      <span class="hint">At least 8 characters.</span>
    </label>
    <label class="field">
      <span class="label">Confirm password</span>
      <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required>
    </label>

    <button class="btn btn-primary" id="submit" type="submit">Create account</button>
  </form>
</div>
<script type="module" src="/assets/auth.js"></script>
</body>
</html>
